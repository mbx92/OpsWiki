# Coolify — OpsWiki (app only)
#
# PostgreSQL = resource terpisah di Coolify (hostname internal, mis. m2a81yq3ad7hvelheztfqywy)
#
# WAJIB di Coolify → Application → Advanced:
#   ✓ Connect to Predefined Network
# Tanpa ini, container app TIDAK bisa reach database meski DB_HOST benar.
#
# Alur deploy:
# - migrate --force (data tetap ada)
# - opswiki:bootstrap (sekali, jika plans kosong)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8009}:80"
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.opswiki-billing-gated.entrypoints=https
      - 'traefik.http.routers.opswiki-billing-gated.rule=Host(`opswiki.ocnetworks.web.id`) && PathPrefix(`/`)'
      - traefik.http.routers.opswiki-billing-gated.priority=100
      - traefik.http.routers.opswiki-billing-gated.service=opswiki-billing-gated
      - traefik.http.routers.opswiki-billing-gated.middlewares=opswiki-billing-gate
      - traefik.http.routers.opswiki-billing-gated.tls=true
      - traefik.http.routers.opswiki-billing-gated.tls.certresolver=letsencrypt
      - traefik.http.services.opswiki-billing-gated.loadbalancer.server.port=80
      - 'traefik.http.middlewares.opswiki-billing-key.headers.customrequestheaders.X-Billing-Gate-Key=${BILLING_GATE_SHARED_KEY:?}'
      - traefik.http.middlewares.opswiki-billing-forward.forwardauth.address=${BILLING_GATE_CHECK_URL:-https://billengine.ocnetworks.web.id/api/billing-gate/check}
      - traefik.http.middlewares.opswiki-billing-forward.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.opswiki-billing-forward.forwardauth.preserveLocationHeader=true
      - traefik.http.middlewares.opswiki-billing-forward.forwardauth.addAuthCookiesToResponse=billing_notice_ack
      - traefik.http.middlewares.opswiki-billing-key-clear.headers.customrequestheaders.X-Billing-Gate-Key=
      - traefik.http.middlewares.opswiki-billing-gate.chain.middlewares=opswiki-billing-key,opswiki-billing-forward,opswiki-billing-key-clear
    environment:
      APP_NAME: ${APP_NAME:-OpsWiki}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_URL: ${DATABASE_URL:-${DB_URL:-}}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      SAAS_CENTRAL_DOMAIN: ${SAAS_CENTRAL_DOMAIN}
      SAAS_DEFAULT_TENANT_SLUG: ${SAAS_DEFAULT_TENANT_SLUG:-default}
      SAAS_DEFAULT_CURRENCY: ${SAAS_DEFAULT_CURRENCY:-IDR}
      SAAS_REGISTRATION_ENABLED: ${SAAS_REGISTRATION_ENABLED:-true}
      SAAS_DNS_CNAME_TARGET: ${SAAS_DNS_CNAME_TARGET:-}
      SAAS_DNS_A_RECORD_IP: ${SAAS_DNS_A_RECORD_IP:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-OpsWiki Admin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_SYNC_PASSWORD: ${SUPER_ADMIN_SYNC_PASSWORD:-false}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@opswiki.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OpsWiki}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      VITE_APP_NAME: ${APP_NAME:-OpsWiki}
    volumes:
      - opswiki_storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

networks:
  coolify:
    external: true

volumes:
  opswiki_storage:
